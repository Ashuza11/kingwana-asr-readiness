  # NOTE: num_beams=1 here is greedy decoding, NOT the Hugging Face model card's
  # documented inference recipe (num_beams=5, length_penalty=0.8, early_stopping=True,
  # suppress_tokens=[]). Kept as-is so the already-collected raw predictions remain a
  # valid "as-shipped default config" ablation point against paza_whisper_large_v3_turbo_beam5.
  paza_whisper_large_v3_turbo:
    enabled: false
    display_name: Paza Whisper Large v3 Turbo (greedy, as-shipped)
    hf_id: microsoft/paza-whisper-large-v3-turbo
    revision: 8a0bd24795b298b2f3678fcd8129c0a1c2b4ee22
    family: whisper
    language: swahili
    evaluation_language: swc
    closest_supported_language: sw
    task: transcribe
    long_form_threshold_seconds: 30.0
    decoding:
      num_beams: 1

  # Decoding config taken from the microsoft/paza-whisper-large-v3-turbo model card's
  # own inference example: num_beams=5, length_penalty=0.8, early_stopping=True,
  # suppress_tokens=[]. The card does not recommend a repetition_penalty or
  # no_repeat_ngram_size; it relies on post-hoc word-count truncation instead.
  paza_whisper_large_v3_turbo_beam5:
    enabled: false
    display_name: Paza Whisper Large v3 Turbo (card decoding config)
    hf_id: microsoft/paza-whisper-large-v3-turbo
    revision: 8a0bd24795b298b2f3678fcd8129c0a1c2b4ee22
    family: whisper
    language: swahili
    evaluation_language: swc
    closest_supported_language: sw
    task: transcribe
    long_form_threshold_seconds: 30.0
    decoding:
      num_beams: 5
      length_penalty: 0.8
      early_stopping: true
      suppress_tokens: []

  paza_whisper_large_v3_turbo_fp32:
